group = "com.portaone.flutter_webrtc_noise_suppression"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.21"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.portaone.flutter_webrtc_noise_suppression"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    // The C core (noise_suppressor.h + RNNoise) is one copy, inside the iOS Swift package, which
    // cannot reach sources outside its directory; CMake builds the same files.
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // flutter_webrtc comes from this plugin's pubspec: the Flutter Gradle plugin adds a
        // plugin's plugin dependencies to its build.
        //
        // flutter_webrtc's AudioProcessingAdapter extends libwebrtc's
        // ExternalAudioProcessingFactory.AudioProcessing, and flutter_webrtc takes libwebrtc as
        // `implementation`, so it is not on this module's compile classpath; at run time
        // flutter_webrtc's own copy is the one loaded. Keep the version flutter_webrtc's
        // android/build.gradle names.
        compileOnly("io.github.webrtc-sdk:android:150.7871.04")
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
