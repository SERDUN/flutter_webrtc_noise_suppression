name: flutter_webrtc_noise_suppression
description: "flutter_webrtc add-on: noise suppression (RNNoise) of the captured voice in flutter_webrtc's capture post-processing slot."
version: 0.0.1
publish_to: none
homepage: https://github.com/SERDUN/flutter_webrtc_noise_suppression

environment:
  sdk: ^3.8.0
  flutter: '>=3.19.0'

# An app takes the same flutter_webrtc spec: pub resolves one flutter_webrtc for the whole app, so
# a spec that differs is a resolution error, not a second copy.
dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc:
    git:
      url: https://github.com/portaone/flutter-webrtc.git
      ref: po/1.6.3-1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.portaone.flutter_webrtc_noise_suppression
        pluginClass: WebrtcNoiseSuppressionPlugin
      ios:
        pluginClass: WebrtcNoiseSuppressionPlugin
